{% extends "tasks/base.html" %}

{% block title %}Tasks list{% endblock %}

{% block content %}
<h2>The list of the tasks</h2>
<table>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Status</th>
        <th>User</th>
    </tr>
    {% for task in tasks %}
    <tr>
        <td>{{ task.pk }}</td>
        <td><a href="{% url 'task_detail' task.pk %}">{{ task.task_name }}</a></td>
        <td>{{ task.get_status_display }}</td>
        <td>{{ task.user }}</td>
    </tr>
    {% empty %}
    <tr><td colspan="4">No tasks</td> </tr>
    {% endfor %}
</table>
{% endblock %}
